version: "3.9"

services:
  # ---------- AUTH SERVICE ----------
  auth-service:
    build:
      context: .
      dockerfile: app/auth/Dockerfile
    ports:
      - "${YINNI_AUTH_HTTP_PORT}:8000"
      - "${YINNI_AUTH_GRPC_PORT}:9000"
    volumes:
      - ./app/auth/configs:/data/conf
    environment:
      KRATOS_SERVER_HTTP_ADDR: 0.0.0.0:8000
      KRATOS_SERVER_GRPC_ADDR: 0.0.0.0:9000
      KRATOS_AUTH_JWT_SECRET: ${YINNI_JWT_SECRET}
      KRATOS_AUTH_JWT_EXPIRE: ${YINNI_JWT_EXPIRE}
      KRATOS_DATA_DATABASE_SOURCE: ${YINNI_DB_SOURCE}
      KRATOS_ADMIN_EMAIL: ${YINNI_ADMIN_EMAIL}
      KRATOS_ADMIN_PASSWORD: ${YINNI_ADMIN_PASSWORD}
      KRATOS_ADMIN_NAME: ${YINNI_ADMIN_NAME}
      KRATOS_ADMIN_ENABLED: "true"
    depends_on:
      mysql:
        condition: service_healthy

    # ---------- USER SERVICE ----------
