  # ---------- PRODUCT SERVICE ----------
  product-service:
    build:
      context: .
      dockerfile: app/product/Dockerfile
    ports:
      - "${PRODUCT_HTTP_PORT}:8002"
      - "${PRODUCT_GRPC_PORT}:9002"
    volumes:
      - ./app/product/product_dataset.json:/app/product_dataset.json
      - ./app/product/configs:/data/conf
    environment:
      KRATOS_SERVER_HTTP_ADDR: 0.0.0.0:8002
      KRATOS_SERVER_GRPC_ADDR: 0.0.0.0:9002
      KRATOS_DATA_DATABASE_SOURCE: ${DB_SOURCE}
      KRATOS_AUTH_JWT_SECRET: ${JWT_SECRET}
      KRATOS_AUTH_JWT_EXPIRE: ${JWT_EXPIRE}
      AI_API_KEY: ${AI_API_KEY}
      AI_CHAT_URL: ${AI_CHAT_URL}
      AI_EMBEDDING_URL: ${AI_EMBEDDING_URL}
      AI_CHAT_MODEL: ${AI_CHAT_MODEL}
      AI_EMBEDDING_MODEL: ${AI_EMBEDDING_MODEL}
    depends_on:
      mysql:
        condition: service_healthy

