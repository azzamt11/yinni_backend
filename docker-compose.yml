  # ---------- MYSQL ----------
  mysql:
    image: mysql:8.0
    ports:
      - "${YINNI_MYSQL_PORT}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${YINNI_MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${YINNI_MYSQL_DATABASE}
      MYSQL_ROOT_HOST: "%"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${YINNI_MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 10s
      retries: 5
      start_period: 30s
