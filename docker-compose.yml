version: "3.9"

services:
  # ---------- AUTH SERVICE ----------
  auth-service:
    build:
      context: .
      dockerfile: app/auth/Dockerfile
    ports:
      - "${AUTH_HTTP_PORT}:8000"
      - "${AUTH_GRPC_PORT}:9000"
    volumes:
      - ./app/auth/configs:/data/conf
    environment:
      KRATOS_SERVER_HTTP_ADDR: 0.0.0.0:8000
      KRATOS_SERVER_GRPC_ADDR: 0.0.0.0:9000
      KRATOS_AUTH_JWT_SECRET: ${JWT_SECRET}
      KRATOS_AUTH_JWT_EXPIRE: ${JWT_EXPIRE}
      KRATOS_DATA_DATABASE_SOURCE: ${DB_SOURCE}
      KRATOS_ADMIN_EMAIL: ${ADMIN_EMAIL}
      KRATOS_ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      KRATOS_ADMIN_NAME: ${ADMIN_NAME}
      KRATOS_ADMIN_ENABLED: "true"
    depends_on:
      mysql:
        condition: service_healthy

    # ---------- USER SERVICE ----------
