version: "3.9"

services:
  # ---------- AUTH SERVICE ----------
  auth-service:
    build:
      context: .
      dockerfile: app/auth/Dockerfile
    ports:
      - "${AUTH_HTTP_PORT}:8000"
      - "${AUTH_GRPC_PORT}:9000"
    volumes:
      - ./app/auth/configs:/data/conf
    environment:
      KRATOS_SERVER_HTTP_ADDR: 0.0.0.0:8000
      KRATOS_SERVER_GRPC_ADDR: 0.0.0.0:9000
      KRATOS_AUTH_JWT_SECRET: ${JWT_SECRET}
      KRATOS_AUTH_JWT_EXPIRE: ${JWT_EXPIRE}
      KRATOS_DATA_DATABASE_SOURCE: ${DB_SOURCE}
    depends_on:
      mysql:
        condition: service_healthy

  # ---------- PRODUCT SERVICE ----------
  product-service:
    build:
      context: .
      dockerfile: app/product/Dockerfile
    ports:
      - "${PRODUCT_HTTP_PORT}:8002"
      - "${PRODUCT_GRPC_PORT}:9002"
    volumes:
      - ./app/product/configs:/data/conf
    environment:
      KRATOS_SERVER_HTTP_ADDR: 0.0.0.0:8002
      KRATOS_SERVER_GRPC_ADDR: 0.0.0.0:9002
      KRATOS_DATA_DATABASE_SOURCE: ${DB_SOURCE}
      KRATOS_AUTH_JWT_SECRET: ${JWT_SECRET}
      KRATOS_AUTH_JWT_EXPIRE: ${JWT_EXPIRE}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
      DEEPSEEK_CHAT_URL: ${DEEPSEEK_CHAT_URL}
      DEEPSEEK_EMBEDDING_URL: ${DEEPSEEK_EMBEDDING_URL}
      DEEPSEEK_CHAT_MODEL: ${DEEPSEEK_CHAT_MODEL}
      DEEPSEEK_EMBEDDING_MODEL: ${DEEPSEEK_EMBEDDING_MODEL}
    depends_on:
      mysql:
        condition: service_healthy

  # ---------- USER SERVICE ----------
  user-service:
    build:
      context: .
      dockerfile: app/user/Dockerfile
    ports:
      - "${USER_HTTP_PORT}:8001"
      - "${USER_GRPC_PORT}:9001"
    volumes:
      - ./app/user/configs:/data/conf
    environment:
      KRATOS_SERVER_HTTP_ADDR: 0.0.0.0:8001
      KRATOS_SERVER_GRPC_ADDR: 0.0.0.0:9001
      KRATOS_DATA_DATABASE_SOURCE: ${DB_SOURCE}
      KRATOS_AUTH_JWT_SECRET: ${JWT_SECRET}
      KRATOS_AUTH_JWT_EXPIRE: ${JWT_EXPIRE}
    depends_on:
      mysql:
        condition: service_healthy

  # ---------- MYSQL ----------
  mysql:
    image: mysql:8.0
    ports:
      - "${MYSQL_PORT}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 10s
      retries: 5
