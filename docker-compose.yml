  # ---------- PRODUCT SERVICE ----------
  product-service:
    build:
      context: .
      dockerfile: app/product/Dockerfile
    ports:
      - "${YINNI_PRODUCT_HTTP_PORT}:8002"
      - "${YINNI_PRODUCT_GRPC_PORT}:9002"
    volumes:
      - ./app/product/product_dataset.json:/app/product_dataset.json
      - ./app/product/configs:/data/conf
    environment:
      KRATOS_SERVER_HTTP_ADDR: 0.0.0.0:8002
      KRATOS_SERVER_GRPC_ADDR: 0.0.0.0:9002
      KRATOS_DATA_DATABASE_SOURCE: ${YINNI_DB_SOURCE}
      KRATOS_AUTH_JWT_SECRET: ${YINNI_JWT_SECRET}
      KRATOS_AUTH_JWT_EXPIRE: ${YINNI_JWT_EXPIRE}
      AI_API_KEY: ${YINNI_AI_API_KEY}
      AI_CHAT_URL: ${YINNI_AI_CHAT_URL}
      AI_EMBEDDING_URL: ${YINNI_AI_EMBEDDING_URL}
      AI_CHAT_MODEL: ${YINNI_AI_CHAT_MODEL}
      AI_EMBEDDING_MODEL: ${YINNI_AI_EMBEDDING_MODEL}
    depends_on:
      mysql:
        condition: service_healthy

