syntax = "proto3";
package kratos.api;

option go_package = "yinni_backend/internal/conf;conf";

import "google/protobuf/duration.proto";

message Auth {
  string jwt_secret = 1;
  int64 jwt_expire = 2;
}

message Bootstrap {
  Server server = 1;
  Data data = 2;
  Auth auth = 3;
  Embeddings embeddings = 4;  // Changed back to Embeddings
  Admin admin = 5; 
  Services services = 6;
}

message Server {
  message HTTP {
    string network = 1;
    string addr = 2;
    google.protobuf.Duration timeout = 3;
  }
  message GRPC {
    string network = 1;
    string addr = 2;
    google.protobuf.Duration timeout = 3;
  }
  HTTP http = 1;
  GRPC grpc = 2;
}

message Data {
  message Database {
    string driver = 1;
    string source = 2;
  }
  message Redis {
    string network = 1;
    string addr = 2;
    google.protobuf.Duration read_timeout = 3;
    google.protobuf.Duration write_timeout = 4;
  }
  Database database = 1;
  Redis redis = 2;
}

message Admin {
  string email = 1;
  string password = 2;
  string name = 3;
  bool enabled = 4;
}

message Embeddings {
  string api_key = 1;
  string model = 2;
  int32 batch_size = 3;
  string base_url = 4;
  int32 timeout_seconds = 5;
  int32 max_retries = 6;
}

message Services {
  string product_service_endpoint = 1;
  string payment_service_endpoint = 2;
  string timeout = 3;
}