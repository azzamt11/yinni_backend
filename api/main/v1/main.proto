syntax = "proto3";

package api.main.v1;

import "google/api/annotations.proto";
import "google/protobuf/struct.proto";

option go_package = "yinni_backend/api/main/v1;v1";

enum PromptType {
  UNKNOWN = 0;
  FIND_ITEM = 1;
  SELECT_OPTION = 2;
  MAKE_PAYMENT = 3;
}

message SendPromptRequest {
  string prompt = 1;
}

message SendPromptReply {
  PromptType type = 1;
  string data = 2;
  string service_response = 3;
}

service Main {
  rpc SendPrompt (SendPromptRequest) returns (SendPromptReply) {
    option (google.api.http) = {
      post: "/v1/prompt"
      body: "*"
    };
  }
}