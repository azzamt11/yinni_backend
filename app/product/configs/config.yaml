server:
  http:
    addr: ${KRATOS_SERVER_HTTP_ADDR:0.0.0.0:8082}
    timeout: 1s
  grpc:
    addr: ${KRATOS_SERVER_GRPC_ADDR:0.0.0.0:9092}
    timeout: 1s

auth:
  jwt_secret: ${KRATOS_AUTH_JWT_SECRET:no-secret}
  jwt_expire: ${KRATOS_AUTH_JWT_EXPIRE:3600}

data:
  database:
    driver: mysql
    source: ${KRATOS_DATA_DATABASE_SOURCE}

embeddings:
  api_key: ${DEEPSEEK_API_KEY}
  model: ${DEEPSEEK_EMBEDDING_MODEL:deepseek-embedder}
  batch_size: 16
  base_url: ${DEEPSEEK_EMBEDDING_URL:https://api.deepseek.com}
  timeout_seconds: 30
  max_retries: 3
